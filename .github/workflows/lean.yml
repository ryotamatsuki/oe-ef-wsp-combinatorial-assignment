name: Lean formal verification

on:
  push:
    branches: [main]
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean.yml"
  pull_request:
    branches:
      - main
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

concurrency:
  group: oe-ef-wsp-combinatorial-assignment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned dependencies
        working-directory: formal/lean
        run: lake update

      - name: Download Mathlib cache
        working-directory: formal/lean
        run: lake exe cache get

      - name: Build Lean formalization
        working-directory: formal/lean
        run: lake build --wfail

name: Lean formal verification

on:
  push:
    branches:
      - main
      - "formal/**"
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean.yml"
  pull_request:
    branches:
      - main
    paths:
      - "formal/lean/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Lean formalization
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: true
          build-args: "--wfail"
